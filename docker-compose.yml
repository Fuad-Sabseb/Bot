services:
  # ==========================================
  # Database Service (PostgreSQL 16 + pgvector)
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-campus_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_admin} -d ${POSTGRES_DB:-campus_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Campus Super App Backend & Web Portal
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_super_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-campus_admin}:${POSTGRES_PASSWORD:-campus_secret_password}@postgres:5432/${POSTGRES_DB:-campus_app}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_random_secret_key_minimum_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - app_storage:/app/storage

volumes:
  postgres_data:
    driver: local
  app_storage:
    driver: local
